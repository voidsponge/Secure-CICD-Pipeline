name: Release

# Publie une image signée et vérifiable à chaque tag vX.Y.Z :
# scan Trivy bloquant → push GHCR → signature Cosign (keyless) → SBOM + provenance SLSA attestés
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  publish:
    name: Build, scan, sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push sur GHCR
      id-token: write # jeton OIDC pour la signature keyless Sigstore
      attestations: write # provenance SLSA stockée par GitHub
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nom de l'image
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: >
          docker build
          --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label org.opencontainers.image.revision="${GITHUB_SHA}"
          --label org.opencontainers.image.version="${VERSION}"
          -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .

      - name: Trivy, aucune CVE haute ou critique avant publication
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY_IMAGE
          image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "${IMAGE}:${VERSION}"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" | cut -d@ -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Image publiée : ${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Signature Cosign (keyless, via OIDC)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REF}"

      - name: SBOM CycloneDX
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"
          $TRIVY_IMAGE image --format cyclonedx --output /out/sbom.cdx.json "${IMAGE}:${VERSION}"

      - name: Attestation SBOM signée
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${REF}"

      - name: Provenance SLSA
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  verify:
    name: Vérification de la signature
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Seul ce workflow, sur un tag de ce repo, est accepté comme signataire
      - name: cosign verify
        run: >
          cosign verify "${REF}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"

      - name: cosign verify-attestation (SBOM)
        run: >
          cosign verify-attestation "${REF}" --type cyclonedx
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          > /dev/null

      - name: gh attestation verify (provenance SLSA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://${REF}" --repo "${GITHUB_REPOSITORY}"
